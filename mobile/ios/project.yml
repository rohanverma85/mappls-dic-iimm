name: IIMM
options:
  minimumXcodeGenVersion: 2.44.0
  deploymentTarget:
    iOS: "17.0"
packages:
  MapplsMap:
    url: https://github.com/mappls-api/mappls-map-ios-distribution.git
    from: 6.1.5
targets:
  IIMM:
    type: application
    platform: iOS
    sources:
      - path: IIMM
    dependencies:
      - package: MapplsMap
        product: MapplsMap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mappls.dic.iimm
        PRODUCT_NAME: IIMM
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: IIMM Platform
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: IIMM uses your location for geo-fenced attendance, inspections, defects, and citizen reports.
        INFOPLIST_KEY_NSCameraUsageDescription: IIMM uses the camera to capture geo-tagged field evidence.
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: IIMM lets you attach field evidence from your photo library.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
